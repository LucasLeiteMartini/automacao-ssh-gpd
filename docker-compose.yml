services:
  back-end:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: automacao-backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  front-end:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: automacao-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      back-end:
        condition: service_healthy
