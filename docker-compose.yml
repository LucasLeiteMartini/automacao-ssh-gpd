services:
  back-end:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: automacao-backend
    restart: always
    expose:
      - "8000"
    env_file:
      - .env
    networks:
      - automacao-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  front-end:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: automacao-frontend
    restart: always
    expose:
      - "80"
    networks:
      - automacao-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  reverse-proxy:
    image: nginx:alpine
    container_name: automacao-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      back-end:
        condition: service_healthy
      front-end:
        condition: service_healthy
    networks:
      - automacao-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  automacao-net:
    driver: bridge
