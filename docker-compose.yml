services:
  back-end:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: automacao-backend
    restart: always
    expose:
      - "8000"
    env_file:
      - .env
    networks:
      - automacao-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  front-end:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: automacao-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      back-end:
        condition: service_healthy
    networks:
      - automacao-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  automacao-net:
    driver: bridge
