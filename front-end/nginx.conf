server {
    listen 80;
    server_name _;

    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Roteamento SPA Angular (interno à rede Docker)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache longo para bundles estáticos com hash do Angular
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }
}
