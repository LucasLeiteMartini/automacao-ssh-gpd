<!-- Cabeçalho Global com Slots para Logo, Brasão, Status e Tema -->
<app-header [health]="health()"></app-header>

<!-- Container Principal com Layout Responsivo Mobile-First -->
<main class="app-container">

  <!-- Alerta de Erro / Operador Ocupado (HTTP 423 / Timeout / Erro Geral) -->
  @if (erroMensagem()) {
    <div class="alert alert-danger d-flex align-items-center justify-content-between p-3 mb-4 custom-card border-danger fade-in" role="alert">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-exclamation-triangle-fill text-danger fs-4"></i>
        <div>
          <strong class="d-block">Aviso do Sistema</strong>
          <span class="small">{{ erroMensagem() }}</span>
        </div>
      </div>
      <button 
        type="button" 
        class="btn-close" 
        aria-label="Fechar" 
        (click)="erroMensagem.set(null)">
      </button>
    </div>
  }

  <!-- ETAPA 1: Formulário de Entrada do Solicitante -->
  @if (etapa() === 'form') {
    <app-consulta-form 
      [loading]="false" 
      (buscar)="onBuscar($event)">
    </app-consulta-form>
  }

  <!-- LOADING FASE 1: Conectando ao terminal e lendo lista -->
  @if (etapa() === 'loading_busca') {
    <app-loading-spinner
      titulo="Fase 1: Conectando ao Terminal Legado"
      descricao="Autenticando operador, navegando nos menus e recuperando registros disponíveis (~1.5s)...">
    </app-loading-spinner>
  }

  <!-- ETAPA 2: Lista de Registros com Seleção Touch e Barra Flutuante Mobile -->
  @if (etapa() === 'lista' && dadosLista()) {
    <app-lista-registros
      [dados]="dadosLista()!"
      [loading]="false"
      (confirmar)="onConfirmarDetalhes($event)"
      (voltar)="onNovaConsulta()">
    </app-lista-registros>
  }

  <!-- LOADING FASE 2: Marcando itens com 'X' e extraindo detalhes -->
  @if (etapa() === 'loading_detalhes') {
    <app-loading-spinner
      titulo="Fase 2: Extraindo Detalhes do Terminal"
      descricao="Abrindo sessão rápida, marcando registros selecionados e consolidando dados (~2.0s)...">
    </app-loading-spinner>
  }

  <!-- ETAPA 3: Exibição dos Detalhes dos Itens Selecionados -->
  @if (etapa() === 'detalhes') {
    <app-detalhe-registros
      [detalhes]="dadosDetalhes()"
      (novaConsulta)="onNovaConsulta()"
      (voltarSelecao)="onVoltarParaLista()">
    </app-detalhe-registros>
  }

</main>
