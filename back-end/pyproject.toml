[project]
name = "automacao"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lucas Martini", email = "lucas.leite.martini@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.143.2",
    "mypy>=2.4.0",
    "paramiko>=5.0.0",
    "pylint>=4.1.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
automacao = "automacao.main:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "types-paramiko>=5.0.0.20261006",
]
